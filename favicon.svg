<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    光学概念和光学设计 —— favicon
    造型：灯泡（本站首页主图标 Lightbulb 的加粗填实版），与页头 .brand .logo 内联 SVG 同源。
    语义取自本站真源图标 Lightbulb（与主入口站 sites.json 的 icon 一致）。
    配色遵循站群统一规范：深底 #0a0a0a / 主形 teal #14b8a6 / amber #f59e0b 仅标关键点。
    2026-09-29 二次修订：初版画的是「凸透镜汇聚平行光」，与页头长期使用的灯泡并非同一物，
    且透镜笔画在 16px 下偏碎；现统一为同一套灯泡 path。
  -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <path d="M16 4 a8 8 0 0 1 4.6 14.5 c-.9.6-1.3 1.4-1.4 2.3 h-6.4 c-.1-.9-.5-1.7-1.4-2.3 A8 8 0 0 1 16 4 Z"
        fill="#14b8a6"/>
  <rect x="12.6" y="21.6" width="6.8" height="2.2" rx="1.1" fill="#f59e0b"/>
  <rect x="13.4" y="25.2" width="5.2" height="2.2" rx="1.1" fill="#14b8a6"/>
</svg>
