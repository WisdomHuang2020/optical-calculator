# ⚠️ 本文件是服务器上 /etc/nginx/sites-available/optical 的**副本**（2026-11-02 核对一致）。
#    仓库不负责下发它 —— 改这里不会影响线上，改线上也不会自动回流。
#    正确顺序：服务器改 → nginx -t → systemctl reload nginx → 线上验证 → 再把线上文件覆盖回本文件。
#
#    为什么放进仓库：该配置此前只存在于服务器，没有任何版本控制，
#    机器一旦出事就无从恢复。2026-11-02 统一「裸名 301 到 www」时才补上这份副本。

# optical.power-knowledge.tech —— 主站（+ www 别名）
#
# 历史沿革：
#   · 2026-09-20: seastar.power-knowledge.tech 曾加入本文件（其 DNS 为 CNAME → optical，
#     故直接复用 /var/www/optical 同一份内容，不另建站点/目录）。
#     同批：80 块的 301 目标由写死的 https://optical.power-knowledge.tech 改为 $host，
#     避免访问别名时被甩回 optical 域名。
#   · 2026-09-30: 443 的 www 独立块（原 return 301 → 裸域）已并入主块 ——
#     按用户要求让 www.optical 与其余五站行为一致，直接返回 200。
#     代价：www 与裸域内容相同（SEO 重复内容），其余五站已是如此。
#   · 2026-09-30: seastar.power-knowledge.tech 服务配置已移除，本机不再服务该域名 ——
#     80 落到 redirects 的 default_server（return 444）；
#     443 落到下方 default_server（ssl_reject_handshake on）。
#     ⚠️ DNS 上的 CNAME 记录仍在，需在 DNS 服务商处另行删除。
#   · 2026-11-02: 策略反转 —— 裸名统一 301 到 www（用户要求六个子域同一规则）。
#     背景：这五个工具站都没有 canonical 标签，裸名与 www 同时 200 属重复内容，
#     301 是唯一归一手段。80 块跳转目标由 $host 改为硬编码 www；
#     443 拆为「裸名 301」+「www 服务」两块。

server {
    listen 80;
    listen [::]:80;
    server_name optical.power-knowledge.tech www.optical.power-knowledge.tech;
    include snippets/acme.conf;
    access_log /var/log/nginx/optical.access.log;
    error_log  /var/log/nginx/optical.error.log;
    location / {
        return 301 https://www.optical.power-knowledge.tech$request_uri;
    }
}

# ── 443：裸名收敛到 www（2026-11-02）──
# 与 llc / ahb / interleavedpfc / web-training 同一套规则：裸名只做 301。
# 跳转目标硬编码 www，不用 $host —— 否则 www 块里 $host 保留 www，会跳回自己成环。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name optical.power-knowledge.tech;

    ssl_certificate     /etc/letsencrypt/live/pk-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pk-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.optical.power-knowledge.tech$request_uri;
}

# ── 443：主服务（www）──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.optical.power-knowledge.tech;
    ssl_certificate /etc/letsencrypt/live/pk-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pk-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security max-age=31536000 always;
    root /var/www/optical;
    index index.html;

    include snippets/security-hardening.conf;
    # favicon 缓存策略：2026-09-29 加（与 widget / wx-seastar 同步）。
    # favicon 是浏览器缓存最顽固的资源（独立缓存、Ctrl+F5 常不生效）。
    # 这里对裸 /favicon.svg 强制每回源校验，配合 index.html 引用上的
    # ?v=<内容哈希> 版本戳（见各站构建脚本），保证图标一改即生效。
    # 注：不要试图用 location 正则去区分带 query string 的请求 —— nginx 的
    #     location 只匹配 URI 路径、不含 query，那种规则永不命中（已实测）。
    location = /favicon.svg {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
}
