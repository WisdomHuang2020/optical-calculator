name: Deploy to Tencent Lighthouse

# 腾讯轻量云部署（与 deploy.yml 的 GitHub Pages **并行独立**，两者互不阻塞）。
#
# 站点：https://optical.power-knowledge.tech/   服务器 43.142.148.37，web 根 /var/www/optical
#       别名 www.optical.power-knowledge.tech / seastar.power-knowledge.tech（同一份内容）
#
# ⚠️ 2026-09-26 新增本工作流。原先本站**没有** push 式 CI 部署，只有
#    deploy/cvm-deploy.sh（服务器端 TAT 拉取式），依赖国内服务器直连 GitHub，
#    慢链下常失败。改为与本站群其他三站（ahb / llc / interleaved-pfc）同构的
#    「CI 构建 + tar over ssh 推送」模式，统一维护方式。
#
# 本站是**纯静态站，无构建步骤**：仓库根目录的 index.html / styles.css / js /
# preview 即运行时产物，直接组装成 _site 上传（组装清单与 pages.yml 保持一致）。
#
# 设计要点（与姊妹站 deploy-lighthouse.yml 同构）：
#   1. **未配置时不报错**：LH_* secrets 缺失时只打 notice 后跳过，不给 main 分支红灯。
#   2. **只在配置齐备时才跑**，避免无意义开销。
#   3. **传输用 tar over ssh**，与站群其他站一致。
#   4. **不做删除**：本次改为**镜像式替换**（先清运行时条目再解包），
#      因为本站资源名不带内容哈希（如 js/app.js），旧文件会与新版同名冲突，
#      沿用「惰性残留」策略会留下不一致状态。含护栏：清理前的备份 + 清理后断言解包成功。
#   5. **拒绝降级部署**：比对本次产物版本与线上版本哨兵 `$LH_ROOT/.deployed-version`，
#      产物**严格早于**线上即中止。版本号来源为 js/version.js（本站单一来源）。
#   6. **属主归位**：解包用 `--no-same-owner` 并 chown 到 www-data。
#
# 所需 repository secrets：
#   LH_HOST     服务器地址（43.142.148.37）
#   LH_USER     登录用户名（root）
#   LH_ROOT     网站根目录绝对路径（必须等于 nginx 的 root 指令，本站为 /var/www/optical）
#   LH_SSH_KEY  部署私钥全文（本站专用密钥 optical_ci，公钥已装入目标机 authorized_keys）
#   LH_PORT     可选，SSH 端口，缺省 22

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个轻量云部署（与本站群其他站保持一致的做法）
concurrency:
  group: "lighthouse-optical"
  cancel-in-progress: false

jobs:
  deploy:
    name: optical.power-knowledge.tech
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 前置判定：密钥未配置时优雅跳过，而不是让流水线变红。
      # ⚠️ 这个分支是「假绿」来源：job 会显示成功，但后面所有步骤都 skipped。
      #    判断是否真的部署了必须下钻到步骤级，确认 `Deploy to server over SSH` 是 success。
      - name: Check configuration
        id: cfg
        env:
          LH_HOST: ${{ secrets.LH_HOST }}
          LH_USER: ${{ secrets.LH_USER }}
          LH_ROOT: ${{ secrets.LH_ROOT }}
          LH_SSH_KEY: ${{ secrets.LH_SSH_KEY }}
        run: |
          if [ -z "$LH_HOST" ] || [ -z "$LH_USER" ] || [ -z "$LH_ROOT" ] || [ -z "$LH_SSH_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=已跳过轻量云部署::未配置 LH_HOST/LH_USER/LH_ROOT/LH_SSH_KEY，本次不上传任何文件。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "配置齐备，将部署到 $LH_USER@$LH_HOST:$LH_ROOT"
          fi

      # 纯静态站：无构建，直接组装运行时文件（清单与 pages.yml 共用同一套约定）
      - name: 组装站点（只发布运行时需要的文件）
        if: steps.cfg.outputs.ready == 'true'
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp -r index.html styles.css js preview _site/
          touch _site/.nojekyll
          echo "--- 发布内容 ---"
          find _site -type f | sort
          # 棱镜板页与棱镜知识页依赖这些文件，缺任一个会导致该页静默失效或白屏。
          for f in js/vendor-three.min.js js/vendor-orbitcontrols.js js/prism.js js/prism-knowledge.js; do
            test -f "_site/$f" || { echo "✘ 缺失发布文件：$f"; exit 1; }
          done
          echo "✔ 棱镜板页 / 知识页依赖文件齐备"

      - name: Deploy to server over SSH
        if: steps.cfg.outputs.ready == 'true'
        env:
          LH_HOST: ${{ secrets.LH_HOST }}
          LH_USER: ${{ secrets.LH_USER }}
          LH_ROOT: ${{ secrets.LH_ROOT }}
          LH_SSH_KEY: ${{ secrets.LH_SSH_KEY }}
          LH_PORT: ${{ secrets.LH_PORT }}
        run: |
          set -euo pipefail
          PORT="${LH_PORT:-22}"
          WEB_OWNER=www-data

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$LH_SSH_KEY" > ~/.ssh/lh_key
          chmod 600 ~/.ssh/lh_key
          ssh-keyscan -p "$PORT" -H "$LH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH_CMD="ssh -p $PORT -i $HOME/.ssh/lh_key -o BatchMode=yes -o ConnectTimeout=20 $LH_USER@$LH_HOST"

          echo "::group::服务器环境"
          $SSH_CMD "whoami; hostname; echo '--- web root ---'; ls -la '$LH_ROOT' | head -20"
          echo "::endgroup::"

          # ---------- 前置断言：LH_ROOT 必须等于 nginx 实际 root ----------
          # 防的正是 cvm-deploy.sh 的 v2 事故：脚本写错目录、"部署成功"但站点未更新。
          NGX_ROOT=$($SSH_CMD "awk '/^[[:space:]]*root[[:space:]]/{print \$2}' /etc/nginx/sites-available/optical | tr -d ';' | head -1")
          echo "nginx 实际 root : ${NGX_ROOT:-（取不到）}"
          echo "本次部署目标   : $LH_ROOT"
          if [ -n "$NGX_ROOT" ] && [ "$NGX_ROOT" != "$LH_ROOT" ]; then
            echo "::error title=路径不一致，拒绝部署::nginx root=$NGX_ROOT 与 LH_ROOT=$LH_ROOT 不符，避免写错目录。"
            exit 1
          fi

          # ---------- 降级护栏（上传前） ----------
          ART_VER=$(grep -oE "APP_VERSION[[:space:]]*=[[:space:]]*'[^']+'" js/version.js | head -1 | sed -E "s/.*'([^']+)'.*/\1/")
          ART_VER="${ART_VER:-unknown}"
          LIVE_VER=$($SSH_CMD "cat '$LH_ROOT/.deployed-version' 2>/dev/null || true" \
                     | tr -d '\r\n' | head -c 64)
          echo "本次产物版本 : $ART_VER"
          echo "线上已部署版本: ${LIVE_VER:-（无记录）}"

          if [ -n "$LIVE_VER" ]; then
            if [ "$LIVE_VER" = "$ART_VER" ]; then
              echo "版本相同，按允许的重复部署处理。"
            else
              OLDEST=$(printf '%s\n%s\n' "$LIVE_VER" "$ART_VER" | sort -V | head -1)
              if [ "$OLDEST" = "$ART_VER" ]; then
                echo "::error title=拒绝降级部署::本次产物 $ART_VER 严格早于线上 $LIVE_VER，已中止以免覆盖线上较新版本。"
                echo "若确需回滚，请手工在服务器上操作，并同步更新 $LH_ROOT/.deployed-version。"
                exit 1
              fi
              echo "产物较新（$ART_VER > $LIVE_VER），允许部署。"
            fi
          else
            echo "::warning title=无线上版本记录::服务器 $LH_ROOT/.deployed-version 不存在，本次跳过降级检查。"
          fi

          # 上传前备份
          $SSH_CMD "tar czf ~/webroot-backup-optical-\$(date +%F-%H%M%S).tar.gz -C '$LH_ROOT' . 2>/dev/null || true"

          # ---------- 镜像式替换 ----------
          # 本站资源名不带内容哈希，必须先清运行时条目再解包，否则旧同名文件残留。
          # 保留 web 根目录本身与 .deployed-version（稍后重写）。
          $SSH_CMD "find '$LH_ROOT' -mindepth 1 -maxdepth 1 ! -name '.deployed-version' -exec rm -rf {} +"

          tar czf - -C _site . | $SSH_CMD "tar xzf - --no-same-owner -C '$LH_ROOT'"
          $SSH_CMD "chown -R $WEB_OWNER:$WEB_OWNER '$LH_ROOT'" || true

          # ---------- 清理后断言：关键运行时文件必须已在位 ----------
          for f in index.html styles.css js/app.js js/version.js; do
            $SSH_CMD "test -f '$LH_ROOT/$f'" || { echo "::error title=部署后校验失败::缺少 $f"; exit 1; }
          done
          echo "✔ 关键运行时文件已落位"

          # 上传成功后写入版本哨兵
          $SSH_CMD "printf '%s\n' '$ART_VER' > '$LH_ROOT/.deployed-version'"
          echo "已写入版本哨兵：$LH_ROOT/.deployed-version = $ART_VER"

      # ⚠️ 自检步骤：只做体检，绝不当门禁（境外 TLS 可能被中间设备中断，而部署本身已成功）。
      - name: Verify live site (self-check, never blocks)
        if: steps.cfg.outputs.ready == 'true'
        continue-on-error: true
        env:
          LH_HOST: ${{ secrets.LH_HOST }}
        run: |
          set +e
          set -uo pipefail
          DOMAIN=optical.power-knowledge.tech
          URL="https://$DOMAIN/"
          LIVE=/tmp/live-optical.html
          ok=0
          for i in 1 2 3; do
            code=$(curl -sS -o "$LIVE" -w '%{http_code}' -m 20 "$URL"); rc=$?
            echo "第 ${i} 次请求：http=$code curl_exit=$rc"
            if [ "$rc" = 0 ] && [ "$code" = "200" ]; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != 1 ] && [ -n "${LH_HOST:-}" ]; then
            code=$(curl -sS -o "$LIVE" -w '%{http_code}' -m 20 \
                   --resolve "$DOMAIN:443:$LH_HOST" "$URL"); rc=$?
            echo "改走 IP（SNI 不变）：http=$code curl_exit=$rc"
          fi
          if [ "$ok" = 1 ]; then
            LOCAL_VER=$(grep -oE "APP_VERSION[[:space:]]*=[[:space:]]*'[^']+'" js/version.js | head -1 | sed -E "s/.*'([^']+)'.*/\1/")
            echo "本次构建版本: ${LOCAL_VER:-unknown}"
            if grep -q "${LOCAL_VER#v}" "$LIVE"; then
              echo "::notice title=核验通过::线上版本戳与本次构建一致（${LOCAL_VER}）"
            else
              echo "::warning title=核验存疑::线上版本戳与本次构建不一致，可能未生效或缓存"
            fi
          else
            echo "::warning title=自检未通过（不影响本次部署）::域名多次访问均失败。"
          fi
          exit 0
