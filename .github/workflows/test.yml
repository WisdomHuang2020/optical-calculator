name: Test (reusable)

# 可复用工作流：CI 与 Pages 部署都调用它，
# 保证"CI 跑的那几条"与"部署前跑的那几条"永远一致，不存在两套测试。
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JS 语法检查
        run: |
          set -e
          n=0
          for f in $(find js tests tools -name '*.js' -type f | sort); do
            node --check "$f"
            n=$((n+1))
          done
          echo "已检查 $n 个 JS 文件，语法全部通过"

      - id: chrome
        uses: browser-actions/setup-chrome@v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 OpenCascade Python 绑定（STEP 内核读回校验）
        # tests/step-export.js 的第 ③ 步要用真实内核读回导出的 STEP。
        # 没有它那一步会 SKIP —— 于是"文件能被内核读成一个有效实体"
        # 这条最重要的性质在 CI 上无人看守。装上前把它变成硬门禁。
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install cadquery-ocp
          python -c "import OCP; print('OCP 就绪')"

      - name: 全部测试套件
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          REQUIRE_CHROME: '1'
          REQUIRE_OCP: '1'
        run: node tests/run-all.js
