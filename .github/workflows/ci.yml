name: CI

# 只在「非 main 的推送」与 PR 上跑：main 的推送由 pages.yml 负责（它内含同一个测试门禁），
# 这样避免同一份测试在 main 上被跑两遍。
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml
